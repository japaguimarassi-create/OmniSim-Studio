name: OmniSim Studio CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omnisim-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Resolve dependencies and create lockfile when missing
        run: npm install --no-audit --no-fund

      - name: Commit generated lockfile on branch pushes
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update npm dependency lockfile"
            git push
          fi

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: TypeScript validation
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: omnisim-studio-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
